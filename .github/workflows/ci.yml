name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            backend:
              - 'backend/**'

  web:
    name: Web (lint, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      # No `pnpm test` step yet: Vitest isn't wired up until WEB-001.

  backend:
    name: Backend (lint, test, build)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, web, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          if [ "${{ needs.changes.result }}" = "failure" ] || \
             [ "${{ needs.web.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ]; then
            echo "A required job failed."
            exit 1
          fi
          echo "web: ${{ needs.web.result }}, backend: ${{ needs.backend.result }}"
